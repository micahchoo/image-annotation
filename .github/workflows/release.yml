name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run release:verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/*.zip
            release/INSTALLATION.json
            release/SHA256SUMS
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md release/*
